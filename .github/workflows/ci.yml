name: CI

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - name: Restore locked dependencies
        run: dotnet restore KeyRadar.sln --locked-mode
      - name: Build release configuration
        run: dotnet build KeyRadar.sln -c Release --no-restore
      - name: Run tests
        run: dotnet test KeyRadar.sln -c Release --no-build --logger "trx;LogFileName=keyradar-tests.trx"
      - name: Build and self-test native x86/x64 observers
        shell: pwsh
        run: ./eng/Build-Native.ps1
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: keyradar-test-results
          path: "**/TestResults/*.trx"
