# Intentionally disabled until the owner confirms the local v1.0.0 executable.
# Move this file to .github/workflows/release.yml only after that explicit confirmation.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - name: Restore and test
        run: |
          dotnet restore KeyRadar.sln --locked-mode
          dotnet test KeyRadar.sln -c Release --no-restore
      - name: Build signed release assets
        shell: pwsh
        env:
          KEYRADAR_ED25519_PRIVATE_KEY: ${{ secrets.KEYRADAR_ED25519_PRIVATE_KEY }}
        run: ./eng/Build-Release.ps1 -Version "${{ github.ref_name }}"
      - name: Publish immutable release assets
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: artifacts/release/*
